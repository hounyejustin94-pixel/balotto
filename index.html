<script>
/* GAMES */
const games = [
 {name:"SUNDAY ASEDA", banker:"01"},
 {name:"MONDAY SPECIAL", banker:"12"},
 {name:"LUCKY TUESDAY", banker:"05"},
 {name:"MID-WEEK", banker:"09"},
 {name:"FORTUNE THURSDAY", banker:"20"},
 {name:"FRIDAY BONANZA", banker:"03"},
 {name:"NATIONAL WEEKLY", banker:"07"}
];

const game = games[new Date().getDay()];
document.getElementById("gameName").textContent = game.name;
const bankerEl = document.getElementById("bankerNum");

function animateBanker(){
    let c=0;
    const i=setInterval(()=>{
        bankerEl.textContent=String(Math.floor(Math.random()*90)+1).padStart(2,'0');
        if(++c>=20){
            clearInterval(i);
            bankerEl.textContent=game.banker;
            bankerEl.style.animation="bounce 1s infinite alternate, glow 1.8s infinite alternate";
        }
    },100);
    setTimeout(()=>{bankerEl.style.animation="";animateBanker();},5000);
}
animateBanker();

/* QUOTES */
const quotes=[
 "Mathematics is the language of patterns — lottery is no exception.",
 "Chance favors the prepared mind.",
 "Randomness reveals structure over time.",
 "Probability rewards patience.",
 "Numbers don’t lie, patterns speak.",
 "Luck is probability misunderstood.",
 "Statistics is the grammar of chance.",
 "Behind randomness lies order.",
 "Every draw leaves a footprint.",
 "Repetition reveals truth.",
 "Chance has memory.",
 "Patterns emerge through observation.",
 "Random is not meaningless.",
 "Probability never forgets.",
 "Numbers repeat behavior.",
 "Chaos hides structure.",
 "Chance obeys laws.",
 "Patterns are silent teachers.",
 "Probability favors consistency.",
 "Mathematics turns luck into logic."
];

let qi=0;
const qEl=document.getElementById("quoteText");
function rotateQuotes(){
    qEl.textContent=quotes[qi];
    qi=(qi+1)%quotes.length;
}
rotateQuotes();
setInterval(rotateQuotes,3000);

/* PWA: Add to Home Screen */
let deferredPrompt;
const a2hsBtn = document.getElementById('a2hsBtn');

window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    a2hsBtn.style.display = 'inline-block';
});

a2hsBtn.addEventListener('click', ()=>{
    if(deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice=>{
            deferredPrompt=null;
            a2hsBtn.style.display='none';
        });
    }
});
