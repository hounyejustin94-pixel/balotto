<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BA LOTTO</title>

  <!-- FORCE NO CACHE -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #111;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(255,215,0,0.4);
    }
    h1 {
      color: gold;
      margin-bottom: 10px;
    }
    .banker {
      font-size: 48px;
      font-weight: bold;
      margin: 15px 0;
      color: #00ffcc;
    }
    .day {
      font-size: 20px;
      margin-top: 10px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>BA LOTTO</h1>
    <div class="banker" id="banker">--</div>
    <div class="day" id="day">Loading...</div>
  </div>

  <script>
    /* =========================
       GHANA TIME (UTC +0)
       CHANGE DAY AT 20:00
    ========================== */

    const bankers = {
      MONDAY: "12",
      TUESDAY: "45",
      WEDNESDAY: "67",
      THURSDAY: "89",
      FRIDAY: "30",   // ← ICI LE 30
      SATURDAY: "21",
      SUNDAY: "54"
    };

    const labels = {
      MONDAY: "MAGIC MONDAY",
      TUESDAY: "TARGET TUESDAY",
      WEDNESDAY: "WINNING WEDNESDAY",
      THURSDAY: "FORTUNE THURSDAY",
      FRIDAY: "FRIDAY BONANZA",
      SATURDAY: "SUPER SATURDAY",
      SUNDAY: "SURE SUNDAY"
    };

    function getLottoDay() {
      const now = new Date();

      // Ghana is UTC+0 → no offset needed
      let dayIndex = now.getUTCDay(); // 0 = Sunday
      const hour = now.getUTCHours();

      // If before 20:00 → use previous day
      if (hour < 20) {
        dayIndex = dayIndex - 1;
        if (dayIndex < 0) dayIndex = 6;
      }

      const days = [
        "SUNDAY",
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY"
      ];

      return days[dayIndex];
    }

    const today = getLottoDay();

    document.getElementById("banker").textContent = bankers[today];
    document.getElementById("day").textContent = labels[today];
  </script>

  <!-- SERVICE WORKER (FORCED UPDATE) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js?v=4");
    }
  </script>
</body>
</html>
